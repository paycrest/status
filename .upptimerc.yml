# Change these first
owner: paycrest # Your GitHub organization or username, where this repository lives
repo: status # The name of this repository

sites:
  - name: Aggregator
    url: https://api.paycrest.io/health
    expectedStatusCodes:
      - 200
      - 301

  - name: Noblocks
    url: https://noblocks.xyz
    expectedStatusCodes:
      - 200
      - 301

  - name: Noblocks Rates
    url: https://rates.noblocks.xyz
    expectedStatusCodes:
      - 200
      - 301

  # NIBSS retired the old freshstatus page. The Netis dashboard
  # (https://status.nibss-plc.com.ng/?system=nip) uses /api/status/systems:
  # aggregate NIP metrics + per-minute timeline buckets — not /summary's
  # institution-driven nip rollup. Upptime body rules cannot match that
  # reliably (numeric metric values change every minute), so Uptime CI runs
  # .github/scripts/reconcile-nibss-nip-status.mjs after each check pass.
  # The server sends an incomplete TLS chain (no Sectigo intermediate), so
  # peer verification fails in curl/Node; hence __dangerous__insecure.
  - name: NIBSS (NIP)
    url: https://status.nibss-plc.com.ng/api/status/systems?range=15m
    expectedStatusCodes:
      - 200
    __dangerous__insecure: true
    __dangerous__body_down_if_text_missing: '"id":"nip","name":"NIBSS Instant Payment (NIP)","short_name":"NIP"'

  - name: Dashboard
    url: https://app.paycrest.io
    expectedStatusCodes:
      - 200
      - 301

  - name: Landing page
    url: https://paycrest.io

status-website:
  cname: status.paycrest.io # Replace with your custom domain, or remove if not using one
  logoUrl: https://avatars.githubusercontent.com/u/128634635?s=200&v=4
  name: Paycrest
  introTitle: "**Service Status**"
  introMessage: >-
    This page shows real-time status of our services.
    Powered by [Upptime](https://github.com/upptime/upptime).
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://paycrest.io

# Notifications
#
# email: requires the usual notifme SMTP secrets set in the repo
#   (NOTIFICATION_EMAIL_SMTP_HOST, NOTIFICATION_EMAIL_SMTP_PORT,
#    NOTIFICATION_EMAIL_SMTP_USERNAME, NOTIFICATION_EMAIL_SMTP_PASSWORD,
#    NOTIFICATION_EMAIL_SMTP_FROM). Without them the email entry is a no-op.
#
# slack: create an Incoming Webhook for #github-alerts in paycrest-io.slack.com
#   and store the webhook URL as the repo secret NOTIFICATION_SLACK_WEBHOOK_URL.
notifications:
  - type: email
    address: engineering@paycrest.io
  - type: slack
    channel: "#github-alerts"

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "*/5 * * * *" # Every 5 minutes
